<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pages Storage</title>
</head>
<body>
    <script>
        const path = decodeURIComponent(window.location.pathname);
        const segments = path.split('/').filter(Boolean);
        const isGitHub = window.location.hostname.includes('github.io');
        const keyIndex = isGitHub ? 1 : 0; 

        // DETECÇÃO AUTOMÁTICA DO SEU PRÓPRIO SERVIDOR WEBSOCKET
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const socketUrl = protocol + window.location.host + '/ws'; 
        const socket = new WebSocket(socketUrl);

        if (segments.length > keyIndex) {
            const nomePagina = segments[keyIndex];
            let htmlConteudo = segments.slice(keyIndex + 1).join('/');

            socket.onopen = () => {
                if (htmlConteudo && htmlConteudo.trim().length > 0) {
                    // CENÁRIO 1: SALVAR VIA URL DIRETA
                    const brand = '<div style="position:fixed;bottom:12px;left:0;width:100%;font-family:sans-serif;font-size:12px;color:#888;text-align:center;pointer-events:none;z-index:9999;">Created with Pages</div>';
                    const codigoFinal = htmlConteudo + brand;

                    const payload = { action: 'publish', name: nomePagina, data: codigoFinal };
                    socket.send(JSON.stringify(payload));

                    const origin = window.location.origin;
                    const repoPath = isGitHub ? `/${segments}` : '';
                    window.location.href = `${origin}${repoPath}/${nomePagina}/`;
                } else {
                    // CENÁRIO 2: LER VIA WEBSOCKET DO SEU PROJETO
                    const payload = { action: 'read', name: nomePagina };
                    socket.send(JSON.stringify(payload));
                }
            };

            // ESCUTA AS RESPOSTAS DO SEU SERVIDOR WEBSOCKET
            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.name === nomePagina) {
                        if (data.action === 'publish' && data.data) {
                            renderizar(data.data);
                        } else if (data.action === 'read-response' && data.data) {
                            renderizar(data.data);
                        } else {
                            // Erro caso o formato venha inválido ou vazio do seu socket
                            document.body.innerHTML = '<h1><pre>Pages</pre></h1><hr><center><h1><b><pre>505</pre></b></h1><br><br><pre>Error: Unable to read data from Websocket ' + socketUrl + '</pre></center>';
                        }
                    }
                } catch (e) {
                    document.body.innerHTML = '<h1><pre>Pages</pre></h1><hr><center><h1><b><pre>505</pre></b></h1><br><br><pre>Error: Unable to read data from Websocket ' + socketUrl + '</pre></center>';
                }
            };

            socket.onerror = () => {
                document.body.innerHTML = '<h1><pre>Pages</pre></h1><hr><center><h1><b><pre>505</pre></b></h1><br><br><pre>Error: Unable to conect to Websocket ' + socketUrl + '</pre></center>';
            };

            socket.onclose = () => {
                document.body.innerHTML = '<pre>conection ended.</pre>';
            };
        } else {
            document.body.innerHTML = '<h1><pre>Pages</pre></h1><hr><center><h1><b><pre>Use PAGES!</pre></b></h1><br><br><pre>Create your first site now with pages!</pre></center>';
        }

        function renderizar(html) {
            document.open();
            document.write(html);
            document.close();
        }
    </script>
</body>
</html>
