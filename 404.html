<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pages Storage</title>
</head>
<body>
    <script>
        const path = decodeURIComponent(window.location.pathname);
        const segments = path.split('/').filter(Boolean);
        const isGitHub = window.location.hostname.includes('github.io');
        const keyIndex = isGitHub ? 1 : 0; 

        // 🚨 COLOQUE AQUI O ENDEREÇO REAL DO SEU SERVIDOR WEBSOCKET 🚨
        // Exemplo: 'ws://45.123.4.5:8080' ou 'wss://://seu-backend-do-projeto.com'
        const socketUrl = 'wss://://seu-servidor-websocket-do-projeto.com'; 
        const socket = new WebSocket(socketUrl);

        if (segments.length > keyIndex) {
            const nomePagina = segments[keyIndex];
            let htmlConteudo = segments.slice(keyIndex + 1).join('/');

            socket.onopen = () => {
                if (htmlConteudo && htmlConteudo.trim().length > 0) {
                    // CENÁRIO 1: SALVAR VIA URL DIRETA
                    const brand = '<div style="position:fixed;bottom:12px;left:0;width:100%;font-family:sans-serif;font-size:12px;color:#888;text-align:center;pointer-events:none;z-index:9999;">Created with Pages</div>';
                    const codigoFinal = htmlConteudo + brand;

                    // Formato exato do seu projeto
                    const payload = { action: 'publish', name: nomePagina, data: codigoFinal };
                    socket.send(JSON.stringify(payload));

                    // Redireciona na hora para a URL limpa de visualização no GitHub
                    const origin = window.location.origin;
                    const repoPath = isGitHub ? `/${segments}` : '';
                    window.location.href = `${origin}${repoPath}/${nomePagina}/`;
                } else {
                    // CENÁRIO 2: LER VIA SEU WEBSOCKET
                    const payload = { action: 'read', name: nomePagina };
                    socket.send(JSON.stringify(payload));
                }
            };

            // ESCUTA O SEU SERVIDOR WEBSOCKET
            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.name === nomePagina) {
                        if (data.action === 'publish' && data.data) {
                            renderizar(data.data);
                        } else if (data.action === 'read-response' && data.data) {
                            renderizar(data.data);
                        }
                    }
                } catch (e) {
                    document.body.innerHTML = 'Erro ao processar dados recebidos do seu WebSocket.';
                }
            };

            socket.onerror = () => {
                document.body.innerHTML = 'Erro de conexao com o SEU servidor WebSocket.';
            };

            socket.onclose = () => {
                document.body.innerHTML = 'A conexao com o SEU WebSocket foi encerrada.';
            };
        } else {
            document.body.innerHTML = 'Pagina inicial. Use o editor ou a URL para publicar.';
        }

        function renderizar(html) {
            document.open();
            document.write(html);
            document.close();
        }
    </script>
</body>
</html>
